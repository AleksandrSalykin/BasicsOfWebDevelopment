<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Aleksandr Salykin">
    <title>Contact | Centria Edu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="container">
         <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#topics">Topics</a></li>
    <li><a href="#">About</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contact.html" aria-current="page"><strong>Contact</strong></a></li>
</ul>
        <h1>Contact us</h1>
        <p>Fill in the form below and send us your message.</p>
    </header>

    <main class="container">
        <section class="topics" id="contact">
            <h2>Contact us</h2>

            <form class="card" action="https://httpbin.org/post" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="phone">Phone number (optional)</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">

                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Choose a subject</option>
                    <option value="feedback">Feedback</option>
                    <option value="question">Question</option>
                    <option value="other">Other</option>
                </select>

                <fieldset>
                    <legend>Preferred contact method</legend>
                    <label for="contact-email">
                        <input type="radio" id="contact-email" name="contact_method" value="email" checked>
                        Email
                    </label>
                    <label for="contact-phone">
                        <input type="radio" id="contact-phone" name="contact_method" value="phone">
                        Phone
                    </label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send message</button>
            </form>
        </section>
    </main>

</body>
</html>
